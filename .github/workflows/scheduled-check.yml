name: Daily ETF report

on:
  schedule:
    # Every day at 22:00 UTC (00:00 CEST / 23:00 CET).
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-etf-report
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Evaluate ETF data (no separate dip notification)
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: go run ./cmd/notifier check --verbose | tee etf-check.log
      - name: Send one daily Telegram report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/daily_report.py < etf-check.log
