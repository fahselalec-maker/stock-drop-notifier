name: ETF intraday dip watch

on:
  schedule:
    # Every 30 minutes on weekdays. Python checks US trading hours.
    - cron: '7,37 13-22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etf-intraday-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - uses: actions/checkout@v4
      - name: Determine New York trading date
        id: date
        run: echo "today=$(TZ=America/New_York date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restore today's sent-alert marker
        id: prior
        uses: actions/cache/restore@v4
        with:
          path: .etf-notified
          key: etf-dip-sent-${{ steps.date.outputs.today }}
      - name: Look for dip with 15-minute rebound
        id: scan
        if: steps.prior.outputs.cache-hit != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 scripts/intraday_dip.py
          if [ -f .etf-notified ]; then echo 'sent=true' >> "$GITHUB_OUTPUT"; fi
      - name: Record sent notification for the day
        if: steps.scan.outputs.sent == 'true'
        uses: actions/cache/save@v4
        with:
          path: .etf-notified
          key: etf-dip-sent-${{ steps.date.outputs.today }}
